<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>과제 동료평가 및 시스템</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Noto Sans KR', sans-serif; display: flex; flex-direction: column; height: 100vh; }
    
    /* Top Bar */
    header { background: #2C3E50; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
    .header-left { display: flex; align-items: center; gap: 15px; }
    select { padding: 8px 12px; border-radius: 4px; font-size: 14px; }
    .teacher-btn { background: #E74C3C; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .teacher-btn.active { background: #27AE60; }
    
    /* Container */
    .main-container { display: flex; flex: 1; overflow: hidden; }
    
    /* Sidebar */
    aside { width: 280px; background: #f8f9fa; border-right: 1px solid #dee2e6; overflow-y: auto; }
    .student-item { padding: 15px; border-bottom: 1px solid #e9ecef; cursor: pointer; transition: 0.2s; }
    .student-item:hover { background: #e9ecef; }
    .student-item.active { background: #E3F2FD; border-left: 4px solid #2196F3; }
    .student-info { font-weight: bold; color: #333; }
    .app-title { font-size: 12px; color: #666; margin-top: 4px; }

    /* Content Area */
    main { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 15px; background: #fff; }
    .meta-card { background: #F8F9FA; padding: 15px; border-radius: 8px; border: 1px solid #E9ECEF; }
    .meta-card h3 { margin: 0 0 10px 0; color: #2C3E50; }
    .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 14px; }

    .view-container { flex: 1; position: relative; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; }
    iframe, textarea { width: 100%; height: 100%; border: none; }
    textarea { font-family: monospace; padding: 15px; background: #282c34; color: #abb2bf; resize: none; white-space: pre; }
    
    .hidden { display: none !important; }
    
    /* Modal */
    .modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; justify-content:center; align-items:center; z-index: 1000; }
    .modal-content { background:white; padding:25px; border-radius:8px; text-align:center; width:300px; }
    .modal-content input { width: 100%; padding: 8px; margin: 15px 0; }
    .modal-buttons { display: flex; gap: 10px; justify-content: center; }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <h2>💻 과제 평가 시스템</h2>
    <select id="topicFilter">
      <option>원 페이지 포트폴리오</option>
      <option>간단한 계산기 웹앱</option>
      <option>랜덤 퀴즈 게임</option>
    </select>
  </div>
  <div>
    <button id="teacherAuthBtn" class="teacher-btn">🔒 교사 인증</button>
    <button id="toggleCodeBtn" class="teacher-btn hidden" style="background:#F39C12;">📝 코드 보기</button>
    <button id="downloadCsvBtn" class="teacher-btn hidden" style="background:#2980B9;">📊 CSV 다운로드</button>
    <button id="deleteSubBtn" class="teacher-btn hidden" style="background:#C0392B;">🗑️ 과제 삭제</button>
  </div>
</header>

<div class="main-container">
  <aside id="studentList"></aside>
  <main>
    <div id="metaArea" class="meta-card">
      <h3 id="dispAppName">학생을 선택하세요</h3>
      <div class="meta-grid">
        <div><strong>주요 기능:</strong> <span id="dispFeatures">-</span></div>
        <div><strong>제작 소감:</strong> <span id="dispImpressions">-</span></div>
      </div>
    </div>
    <div class="view-container">
      <iframe id="viewer" sandbox="allow-scripts"></iframe>
      <textarea id="codeViewer" class="hidden" readonly></textarea>
    </div>
  </main>
</div>

<!-- Modal -->
<div id="authModal" class="modal hidden">
  <div class="modal-content">
    <h3>교사 인증</h3>
    <input type="password" id="teacherPw" placeholder="비밀번호 입력">
    <div class="modal-buttons">
      <button id="modalConfirm">확인</button>
      <button id="modalCancel">취소</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // TODO: 본인의 Firebase 설정 정보로 변경하세요
  const firebaseConfig = {
    apiKey: "AIzaSyCM_RKccvV-P1gn4iuxJwK6-xfRxEytWRQ",
    authDomain: "vibecoding-b43b0.firebaseapp.com",
    projectId: "vibecoding-b43b0",
    storageBucket: "vibecoding-b43b0.firebasestorage.app",
    messagingSenderId: "409114055618",
    appId: "1:409114055618:web:37798360dec1ff08e3fc5b"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let isTeacher = false;
  let rawSubmissions = [];
  let latestSubmissions = [];
  let selectedStudentId = null;
  let selectedDocId = null; // 선택된 문서 ID 저장용
  let currentStudentObj = null; // 선택된 학생 객체 저장용
  const TEACHER_PASSWORD = "admin"; // 교사 비밀번호 설정

  const topicFilter = document.getElementById('topicFilter');
  const studentListEl = document.getElementById('studentList');
  const viewer = document.getElementById('viewer');
  const codeViewer = document.getElementById('codeViewer');
  
  // 데이터 로드 및 중복 제거(최신순 1개만)
  async function loadData() {
    const selectedTopic = topicFilter.value;
    const q = query(collection(db, "submissions"), where("topic", "==", selectedTopic));
    const querySnapshot = await getDocs(q);

    rawSubmissions = [];
    querySnapshot.forEach(docSnap => {
      rawSubmissions.push({ id: docSnap.id, ...docSnap.data() });
    });

    // 동일 학번 중 최신 타임스탬프 과제만 추출
    const grouped = {};
    rawSubmissions.forEach(item => {
      const sid = item.studentId;
      if (!grouped[sid]) {
        grouped[sid] = item;
      } else {
        const currentTime = item.timestamp?.toMillis() || 0;
        const prevTime = grouped[sid].timestamp?.toMillis() || 0;
        if (currentTime > prevTime) grouped[sid] = item;
      }
    });

    latestSubmissions = Object.values(grouped).sort((a, b) => a.studentId.localeCompare(b.studentId));
    renderSidebar();
  }

  // 사이드바 목록 출력
  function renderSidebar() {
    studentListEl.innerHTML = '';
    if (latestSubmissions.length === 0) {
      studentListEl.innerHTML = '<div style="padding:15px; color:#888;">제출된 과제가 없습니다.</div>';
      clearViewer();
      return;
    }

    latestSubmissions.forEach(sub => {
      const item = document.createElement('div');
      item.className = `student-item ${sub.studentId === selectedStudentId ? 'active' : ''}`;
      item.innerHTML = `
        <div class="student-info">${sub.studentId} ${sub.name}</div>
        <div class="app-title">${sub.appName}</div>
      `;
      item.onclick = () => selectStudent(sub);
      studentListEl.appendChild(item);
    });

    // 현재 선택된 학생이 목록에 없거나 초기 상태일 때 첫 번째 과제 선택
    const exists = latestSubmissions.find(s => s.studentId === selectedStudentId);
    if (!exists && latestSubmissions.length > 0) {
      selectStudent(latestSubmissions[0]);
    }
  }

  // 특정 학생 클릭 시 렌더링
  function selectStudent(sub) {
    selectedStudentId = sub.studentId;
    selectedDocId = sub.id;
    currentStudentObj = sub;
    renderSidebar();

    document.getElementById('dispAppName').innerText = sub.appName;
    document.getElementById('dispFeatures').innerText = sub.features;
    document.getElementById('dispImpressions').innerText = sub.impressions;

    // iframe에 코드 주입하여 즉시 실행
    viewer.srcdoc = sub.code;
    codeViewer.value = sub.code;
  }

  function clearViewer() {
    document.getElementById('dispAppName').innerText = '선택된 과제 없음';
    document.getElementById('dispFeatures').innerText = '-';
    document.getElementById('dispImpressions').innerText = '-';
    viewer.srcdoc = '';
    codeViewer.value = '';
    selectedStudentId = null;
    selectedDocId = null;
    currentStudentObj = null;
  }

  // 이벤트 리스너
  topicFilter.addEventListener('change', () => {
    selectedStudentId = null;
    loadData();
  });

  // 교사 인증 관련
  const teacherAuthBtn = document.getElementById('teacherAuthBtn');
  const authModal = document.getElementById('authModal');
  const toggleCodeBtn = document.getElementById('toggleCodeBtn');
  const downloadCsvBtn = document.getElementById('downloadCsvBtn');
  const deleteSubBtn = document.getElementById('deleteSubBtn');

  teacherAuthBtn.onclick = () => {
    if(isTeacher) {
      isTeacher = false;
      teacherAuthBtn.innerText = '🔒 교사 인증';
      teacherAuthBtn.classList.remove('active');
      toggleCodeBtn.classList.add('hidden');
      downloadCsvBtn.classList.add('hidden');
      deleteSubBtn.classList.add('hidden');
      codeViewer.classList.add('hidden');
      viewer.classList.remove('hidden');
    } else {
      authModal.classList.remove('hidden');
    }
  };

  document.getElementById('modalCancel').onclick = () => authModal.classList.add('hidden');
  document.getElementById('modalConfirm').onclick = () => {
    const pw = document.getElementById('teacherPw').value;
    if (pw === TEACHER_PASSWORD) {
      isTeacher = true;
      teacherAuthBtn.innerText = '🔓 교사 모드 실행 중';
      teacherAuthBtn.classList.add('active');
      toggleCodeBtn.classList.remove('hidden');
      downloadCsvBtn.classList.remove('hidden');
      deleteSubBtn.classList.remove('hidden');
      authModal.classList.add('hidden');
      document.getElementById('teacherPw').value = '';
    } else {
      alert('비밀번호가 올바르지 않습니다.');
    }
  };

  // 과제 삭제 처리 기능
  deleteSubBtn.onclick = async () => {
    if (!selectedDocId || !currentStudentObj) {
      return alert('삭제할 과제를 선택하세요.');
    }

    const confirmMsg = `[${currentStudentObj.studentId} ${currentStudentObj.name}] 학생의 과제를 삭제하시겠습니까?\n삭제된 과제는 복구할 수 없습니다.`;
    if (!confirm(confirmMsg)) return;

    try {
      deleteSubBtn.disabled = true;
      deleteSubBtn.innerText = '삭제 중...';

      // Firestore에서 해당 문서 삭제
      await deleteDoc(doc(db, "submissions", selectedDocId));

      alert('과제가 성공적으로 삭제되었습니다.');
      selectedStudentId = null;
      await loadData(); // 목록 새로고침
    } catch (error) {
      console.error('삭제 오류:', error);
      alert('삭제 중 오류가 발생했습니다.');
    } finally {
      deleteSubBtn.disabled = false;
      deleteSubBtn.innerText = '🗑️ 과제 삭제';
    }
  };

  // 코드 보기 토글
  toggleCodeBtn.onclick = () => {
    if (codeViewer.classList.contains('hidden')) {
      codeViewer.classList.remove('hidden');
      viewer.classList.add('hidden');
      toggleCodeBtn.innerText = '🖼️ 실행 화면 보기';
    } else {
      codeViewer.classList.add('hidden');
      viewer.classList.remove('hidden');
      toggleCodeBtn.innerText = '📝 코드 보기';
    }
  };

  // CSV 추출 (UTF-8 BOM 포함)
  downloadCsvBtn.onclick = () => {
    if (latestSubmissions.length === 0) return alert('다운로드할 데이터가 없습니다.');

    const headers = ["주제", "학번", "이름", "앱 이름", "주요 기능", "제작 소감", "제출 시간", "원시 코드"];
    
    const rows = latestSubmissions.map(s => {
      const dateStr = s.timestamp ? new Date(s.timestamp.toMillis()).toLocaleString('ko-KR') : '';
      return [
        s.topic,
        s.studentId,
        s.name,
        s.appName,
        s.features,
        s.impressions,
        dateStr,
        s.code
      ].map(val => `"${String(val || '').replace(/"/g, '""')}"`); // CSV 이스케이프
    });

    const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(r => r.join(","))].join("\n");
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    const url = URL.createObjectURL(blob);
    
    link.setAttribute("href", url);
    link.setAttribute("download", `${topicFilter.value}_과제제출일괄.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };

  // 초기화
  loadData();
</script>
</body>
</html>
